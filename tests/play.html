<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deep See World playthrough</title>
</head>
<body>
<!-- Headless playthrough driven by tests/check.py. Results go to the console as "PLAY ..." lines.
     Needs Chrome's --allow-file-access-from-files so the test can reach into the iframe. -->
<iframe id="game" width="1200" height="800"></iframe>
<script>
"use strict";
let failures = 0;
const log = (msg) => console.log("PLAY " + msg);
const check = (label, cond) => { if (cond) log("OK " + label); else { failures++; log("FAIL " + label); } };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

try { localStorage.removeItem("deep-see-world:v1"); } catch (e) { /* fresh profile anyway */ }
const frame = document.getElementById("game");
frame.src = "../index.html";
frame.addEventListener("load", () => run().catch((e) => { failures++; log("FAIL crashed: " + e); }).finally(() => log("DONE " + failures)));

async function run() {
  const w = frame.contentWindow, d = w.document;
  w.addEventListener("error", (e) => { failures++; log("FAIL page error: " + e.message); });
  const $ = (s) => d.querySelector(s);
  const prompt = () => $("#prompt").textContent;
  const saved = () => JSON.parse(w.localStorage.getItem("deep-see-world:v1"));
  const hit = (id) => $('.hit[data-id="' + id + '"]').dispatchEvent(new w.MouseEvent("click", { bubbles: true }));
  const action = (text) => {
    const b = [...d.querySelectorAll("#actions button")].find((x) => x.textContent.includes(text));
    if (!b) throw new Error("no action button: " + text + " (prompt: " + prompt() + ")");
    b.click();
  };
  await wait(300);

  // A stand-in voice: headless Chrome can't speak, so record what would be read aloud.
  const spoken = [], rates = [];
  const voice = { name: "Test voice", lang: "en-US", localService: true, default: true, voiceURI: "test" };
  const synth = { getVoices: () => [voice], speak: (u) => { spoken.push(u.text); rates.push(u.rate); }, cancel() {}, pause() {}, resume() {}, speaking: false, pending: false, paused: false };
  Object.defineProperty(w, "speechSynthesis", { configurable: true, get: () => synth });
  const lastSpoken = () => spoken[spoken.length - 1] || "";
  const near = (a, b) => Math.abs(a - b) < 0.01;  // the browser stores rates as 32-bit floats
  const closeZoneCard = async (zone) => {
    check(zone + ": Where-am-I card opens on arrival", $("#zoneCard").open);
    check(zone + ": card is read aloud", spoken.some((x) => x.includes("You are in the " + zone)));
    $("#zcExplore").click();
    await wait(50);
  };

  // --- Welcome screen and the first Where-am-I card ---
  check("welcome: shown on load", !$("#welcome").hidden);
  check("welcome: nothing is read before the first click", spoken.length === 0);
  check("welcome: explains that puzzles unlock the way deeper", $("#welcome").textContent.includes("Solve the puzzle in each zone to unlock the way deeper"));
  $("#btnStart").click();
  check("welcome: start hides it", $("#welcome").hidden);
  await wait(20);
  check("narration: voice is off by default", spoken.length === 0 && saved().narration === false);
  // Turn the voice on, then reopen the Where-am-I card to hear it.
  $("#zcExplore").click();
  $("#btnNarration").click();
  $('#vpOnOff button[data-v="on"]').click();
  $("#vpClose").click();
  $("#btnWhere").click();
  check("zone card: speaks temperatures in words", spoken.some((x) => x.includes("25 to 29 degrees Celsius")));
  check("zone card: stats are read with their labels", spoken.some((x) => x.startsWith("Pressure: ")));
  check("narration: reads slowly by default", rates.length > 0 && rates.every((r) => near(r, 0.7)));
  check("zone card: awards its facts", ["sunlit", "redLight"].every((f) => saved().facts.includes(f)));
  await closeZoneCard("Sunlit Zone");
  check("narration: closing the card reads the reef instructions", lastSpoken().startsWith("Welcome to the coral reef"));

  // --- Reef: symbiosis pairs ---
  hit("clownfish");
  check("reef: picking an animal shows its clue", prompt().startsWith("Clownfish:"));
  await wait(20);
  check("narration: clues are read without quote marks", lastSpoken().startsWith("Clownfish: I need a home") && !lastSpoken().includes("“"));
  const panelPick = (group, v) => $(group + ' button[data-v="' + v + '"]').click();
  $("#btnNarration").click();
  check("voice panel: opens from the read-aloud button", $("#voicePanel").open);
  check("voice panel: lists the device's voices", $("#vpVoice").options.length === 1);
  panelPick("#vpSpeed", "fast");
  check("voice panel: speed change plays a sample at that speed", lastSpoken().startsWith("Hi! I'm your guide") && near(rates[rates.length - 1], 1));
  panelPick("#vpSpeed", "slow");
  panelPick("#vpOnOff", "off");
  $("#vpClose").click();
  const before = spoken.length;
  hit("clownfish");
  await wait(20);
  check("narration: the read-aloud switch turns it off", spoken.length === before && saved().narration === false);
  $("#btnNarration").click();
  panelPick("#vpOnOff", "on");
  $("#vpClose").click();
  hit("clownfish");
  await wait(20);
  check("narration: turning it back on reads again, slowly", lastSpoken().startsWith("Clownfish:") && near(rates[rates.length - 1], 0.7));
  check("dive: button is visible but locked before solving", $("#btnDown").classList.contains("locked") && $("#btnDown").textContent.includes("🔒"));
  $("#btnDown").click();
  await wait(20);
  check("dive: locked button explains what to do", !$("#toast").hidden && lastSpoken().includes("first match all the animal partners"));
  check("dive: locked button doesn't leave the reef", saved().room === "reef");
  hit("eel");
  check("reef: a wrong pair is explained", prompt().includes("aren't partners"));
  hit("clownfish"); hit("anemone");
  hit("eel"); hit("shrimp");
  hit("pistol"); hit("goby");
  await wait(1000);
  check("reef: solved after three pairs", saved().solved.reef === true);
  check("reef: pair facts collected", ["anemone", "cleaner", "goby"].every((f) => saved().facts.includes(f)));
  check("reef: dive button unlocks", !$("#btnDown").classList.contains("locked") && $("#btnDown").textContent.includes("Dive deeper"));
  hit("pistol");
  check("reef: paired pistol shrimp teaches its snap", saved().facts.includes("pistolSnap"));

  // --- Turtle Lunch opens and closes ---
  hit("turtle");
  action("Turtle Lunch");
  check("turtle: game opens", !$("#turtle").hidden);
  await wait(20);
  check("turtle: instructions are read, arrows spoken as words", lastSpoken().includes("the arrow keys") && !lastSpoken().includes("←"));
  [...d.querySelectorAll("#turtleActions button")].find((b) => b.textContent.includes("Start")).click();
  await wait(1500);
  check("turtle: game panel hides while playing", $("#turtlePanel").hidden);
  w.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Escape" }));
  check("turtle: Escape closes it", $("#turtle").hidden);

  // --- Twilight: migration ---
  $("#btnDown").click();
  await wait(1000);
  check("twilight: arrived", saved().room === "twilight");
  await closeZoneCard("Twilight Zone");
  action("Let's go");
  action("Stay deep");
  check("twilight: wrong night answer is explained", prompt().includes("go hungry"));
  action("Swim up");
  await wait(3200);
  check("twilight: day round follows", prompt().includes("sun is rising"));
  action("Swim up");
  check("twilight: wrong day answer is explained", prompt().includes("predators"));
  action("Stay deep");
  await wait(3200);
  check("twilight: solved", saved().solved.twilight === true && saved().facts.includes("migration"));

  // --- Midnight: copy the light patterns, recording each flash as it happens ---
  $("#btnDown").click();
  await wait(1000);
  check("midnight: arrived", saved().room === "midnight");
  await closeZoneCard("Midnight Zone");
  let seen = [];
  new w.MutationObserver((muts) => muts.forEach((m) => {
    if (m.target.classList.contains("flash") && !(m.oldValue || "").includes("flash")) seen.push(m.target.id.replace("light-", ""));
  })).observe($("#scene-midnight"), { subtree: true, attributes: true, attributeFilter: ["class"], attributeOldValue: true });
  action("Let's go");
  action("Watch the lights");
  for (let level = 0; level < 3; level++) {
    await wait(0);
    seen = [];
    for (let i = 0; i < 100 && !prompt().startsWith("Your turn"); i++) await wait(100);
    check("midnight: level " + (level + 1) + " shows " + (3 + level) + " flashes", seen.length === 3 + level);
    if (level === 0) {  // one deliberate mistake first
      const wrong = ["anglerfish", "atolla", "vampireSquid"].find((g) => g !== seen[0]);
      hit(wrong);
      check("midnight: wrong order replays", prompt().includes("wrong order"));
      await wait(0);  // observer records flashes asynchronously; drop our own wrong click first
      seen = [];
      await wait(1600);
      for (let i = 0; i < 100 && !prompt().startsWith("Your turn"); i++) await wait(100);
    }
    const order = seen.slice();
    for (const g of order) { hit(g); await wait(120); }
    await wait(600);
  }
  await wait(1500);
  check("midnight: solved", saved().solved.midnight === true);
  check("midnight: last zone says deeper zones are coming", $("#btnDown").classList.contains("locked") && $("#btnDown").textContent.includes("Even deeper"));
  check("midnight: final facts", ["bioluminescence", "unexplored"].every((f) => saved().facts.includes(f)));

  // --- Journal ---
  $("#btnJournal").click();
  check("journal: lists 24 cards", d.querySelectorAll("#journalBody .card").length === 24);
  check("journal: every found fact has a listen button", d.querySelectorAll("#journalBody .card:not(.locked) .listen").length === saved().facts.length);
  check("journal: found facts are unlocked", d.querySelectorAll("#journalBody .card:not(.locked)").length === saved().facts.length);
}
</script>
</body>
</html>
