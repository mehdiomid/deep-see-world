<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deep See World playthrough</title>
</head>
<body>
<!-- Headless playthrough driven by tests/check.py. Results go to the console as "PLAY ..." lines.
     Needs Chrome's --allow-file-access-from-files so the test can reach into the iframe. -->
<iframe id="game" width="1200" height="800"></iframe>
<script>
"use strict";
let failures = 0;
const log = (msg) => console.log("PLAY " + msg);
const check = (label, cond) => { if (cond) log("OK " + label); else { failures++; log("FAIL " + label); } };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

try { localStorage.removeItem("deep-see-world:v1"); } catch (e) { /* fresh profile anyway */ }
const frame = document.getElementById("game");
frame.src = "../index.html#reef";
frame.addEventListener("load", () => run().catch((e) => { failures++; log("FAIL crashed: " + e); }).finally(() => log("DONE " + failures)));

async function run() {
  const w = frame.contentWindow, d = w.document;
  w.addEventListener("error", (e) => { failures++; log("FAIL page error: " + e.message); });
  const $ = (s) => d.querySelector(s);
  const prompt = () => $("#prompt").textContent;
  const saved = () => JSON.parse(w.localStorage.getItem("deep-see-world:v1"));
  const hit = (id) => $('.hit[data-id="' + id + '"]').dispatchEvent(new w.MouseEvent("click", { bubbles: true }));
  const action = (text) => {
    const b = [...d.querySelectorAll("#actions button")].find((x) => x.textContent.includes(text));
    if (!b) throw new Error("no action button: " + text + " (prompt: " + prompt() + ")");
    b.click();
  };
  await wait(300);

  // --- Reef: symbiosis pairs ---
  hit("clownfish");
  check("reef: picking an animal shows its clue", prompt().startsWith("Clownfish:"));
  hit("eel");
  check("reef: a wrong pair is explained", prompt().includes("aren't partners"));
  hit("clownfish"); hit("anemone");
  hit("eel"); hit("shrimp");
  hit("pistol"); hit("goby");
  await wait(1000);
  check("reef: solved after three pairs", saved().solved.reef === true);
  check("reef: pair facts collected", ["anemone", "cleaner", "goby"].every((f) => saved().facts.includes(f)));
  check("reef: dive button appears", !$("#btnDown").hidden);
  hit("pistol");
  check("reef: paired pistol shrimp teaches its snap", saved().facts.includes("pistolSnap"));

  // --- Turtle Lunch opens and closes ---
  hit("turtle");
  action("Turtle Lunch");
  check("turtle: game opens", !$("#turtle").hidden);
  [...d.querySelectorAll("#turtleActions button")].find((b) => b.textContent.includes("Start")).click();
  await wait(1500);
  check("turtle: game panel hides while playing", $("#turtlePanel").hidden);
  w.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Escape" }));
  check("turtle: Escape closes it", $("#turtle").hidden);

  // --- Twilight: migration ---
  $("#btnDown").click();
  await wait(1000);
  check("twilight: arrived", saved().room === "twilight");
  action("Let's go");
  action("Stay deep");
  check("twilight: wrong night answer is explained", prompt().includes("go hungry"));
  action("Swim up");
  await wait(3200);
  check("twilight: day round follows", prompt().includes("sun is rising"));
  action("Swim up");
  check("twilight: wrong day answer is explained", prompt().includes("predators"));
  action("Stay deep");
  await wait(3200);
  check("twilight: solved", saved().solved.twilight === true && saved().facts.includes("migration"));

  // --- Midnight: copy the light patterns, recording each flash as it happens ---
  $("#btnDown").click();
  await wait(1000);
  check("midnight: arrived", saved().room === "midnight");
  let seen = [];
  new w.MutationObserver((muts) => muts.forEach((m) => {
    if (m.target.classList.contains("flash") && !(m.oldValue || "").includes("flash")) seen.push(m.target.id.replace("light-", ""));
  })).observe($("#scene-midnight"), { subtree: true, attributes: true, attributeFilter: ["class"], attributeOldValue: true });
  action("Let's go");
  action("Watch the lights");
  for (let level = 0; level < 3; level++) {
    await wait(0);
    seen = [];
    for (let i = 0; i < 100 && !prompt().startsWith("Your turn"); i++) await wait(100);
    check("midnight: level " + (level + 1) + " shows " + (3 + level) + " flashes", seen.length === 3 + level);
    if (level === 0) {  // one deliberate mistake first
      const wrong = ["anglerfish", "atolla", "vampireSquid"].find((g) => g !== seen[0]);
      hit(wrong);
      check("midnight: wrong order replays", prompt().includes("wrong order"));
      await wait(0);  // observer records flashes asynchronously; drop our own wrong click first
      seen = [];
      await wait(1600);
      for (let i = 0; i < 100 && !prompt().startsWith("Your turn"); i++) await wait(100);
    }
    const order = seen.slice();
    for (const g of order) { hit(g); await wait(120); }
    await wait(600);
  }
  await wait(1500);
  check("midnight: solved", saved().solved.midnight === true);
  check("midnight: final facts", ["bioluminescence", "unexplored"].every((f) => saved().facts.includes(f)));

  // --- Journal ---
  $("#btnJournal").click();
  check("journal: lists 21 cards", d.querySelectorAll("#journalBody .card").length === 21);
  check("journal: found facts are unlocked", d.querySelectorAll("#journalBody .card:not(.locked)").length === saved().facts.length);
}
</script>
</body>
</html>
