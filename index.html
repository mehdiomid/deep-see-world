<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep See World</title>
<meta name="description" content="An educational point-and-click puzzle adventure through the ocean, from the sunlit reef to the Midnight Zone.">
<style>
  :root {
    --bg: #04203a;
    --panel: #0b2f52;
    --panel-2: #12406b;
    --ink: #eef8ff;
    --ink-soft: #a9cbe6;
    --accent: #ffd23f;
    --accent-ink: #2a1d00;
    --coral: #ff6f91;
    --radius: 14px;
    --font: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at top, #0c3b66, var(--bg) 70%);
    color: var(--ink);
    font-family: var(--font);
    display: flex;
    flex-direction: column;
    min-height: 100svh;
  }
  button { font: inherit; }

  /* Top bar */
  .topbar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px;
  }
  .topbar h1 { margin: 0; font-size: 1.35rem; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
  .topbar h1 .see { color: var(--accent); }
  .zone { display: flex; align-items: center; gap: 10px; color: var(--ink-soft); font-size: .95rem; margin-right: auto; }
  .zone-bar { display: flex; gap: 3px; }
  .zone-bar span { width: 26px; height: 8px; border-radius: 4px; background: #ffffff22; }
  .zone-bar span.on { background: var(--accent); }
  .zone-bar span.done { background: #ffd23f77; }
  .btn {
    border: 0; border-radius: 999px; padding: 9px 16px; cursor: pointer;
    background: var(--panel-2); color: var(--ink); font-weight: 600;
    transition: transform .12s, background .12s;
  }
  .btn:hover { background: #1b5288; }
  .btn:active { transform: scale(.96); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { background: #ffe066; }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .icon-btn { padding: 9px 12px; }
  .count { background: #ffffff22; border-radius: 999px; padding: 1px 8px; margin-left: 6px; font-size: .85em; }
  .pulse { animation: pulse .8s ease; }
  @keyframes pulse { 40% { transform: scale(1.18); background: var(--accent); color: var(--accent-ink); } }

  /* Stage */
  main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 0 16px 16px; gap: 10px; }
  .stage {
    position: relative;
    width: min(100%, calc((100svh - 250px) * 5 / 3));
    min-width: min(100%, 320px);
    aspect-ratio: 5 / 3;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 10px 40px #0008, inset 0 0 0 2px #ffffff14;
    background: #021020;
  }
  .scene {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; visibility: hidden; transition: opacity .5s, visibility .5s;
  }
  .scene.active { opacity: 1; visibility: visible; }
  .stage.diving .scene.active { opacity: 0; }
  .nav-btn { position: absolute; left: 50%; transform: translateX(-50%); z-index: 2; box-shadow: 0 4px 14px #0007; }
  .nav-btn.up { top: 10px; }
  .nav-btn.down { bottom: 12px; left: auto; right: 12px; transform: none; animation: beckon 1.6s ease-in-out infinite; }
  @keyframes beckon { 50% { transform: translateY(5px); } }
  [hidden] { display: none !important; }

  /* Clickable things in the scenes */
  .hit { cursor: pointer; outline: none; }
  .hit:hover, .hit:focus-visible, .hit.selected { filter: url(#glow); }
  /* Animate the inner group: the .hit group's own transform attribute positions it in the scene. */
  .hit.selected > .mover > * { animation: wiggle .5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes wiggle { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  .mover { transition: transform 1.6s cubic-bezier(.45,.05,.3,1); }
  .bob { animation: bob 3.2s ease-in-out infinite; }
  .bob.slow { animation-duration: 5s; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  .sway { animation: sway 3.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
  .ray { animation: ray 6s ease-in-out infinite alternate; }
  .ray:nth-child(2n) { animation-delay: -3s; }
  @keyframes ray { from { opacity: .35; } to { opacity: .9; } }
  .bubble { animation: rise linear infinite; }
  @keyframes rise { from { transform: translateY(0); opacity: .8; } to { transform: translateY(-640px); opacity: 0; } }
  .drift { animation: drift 18s linear infinite; }
  @keyframes drift { from { transform: translateX(-200px); } to { transform: translateX(1200px); } }
  .snow { animation: snow linear infinite; }
  @keyframes snow { from { transform: translateY(-40px); } to { transform: translateY(640px); } }
  .heart { animation: heart 1.6s ease-out forwards; font-size: 36px; pointer-events: none; }
  @keyframes heart { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-70px); opacity: 0; } }

  /* Twilight: day/night sky and the migrating school */
  #scene-twilight .sky { transition: fill 1.5s; fill: #1b2246; }
  #scene-twilight.is-day .sky { fill: #8fd3ff; }
  #scene-twilight .sun, #scene-twilight .moon, #scene-twilight .stars { transition: opacity 1.5s; }
  #scene-twilight.is-day .moon, #scene-twilight.is-day .stars { opacity: 0; }
  #scene-twilight.is-night .sun { opacity: 0; }
  #school .mover { transition: transform 2.6s cubic-bezier(.45,.05,.3,1); }
  #school.up .mover { transform: translateY(-330px); }
  #school.shake .bob { animation: shake .4s; }
  @keyframes shake { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  .plankton circle { transition: opacity 1.5s 1.4s; }
  .plankton.eaten circle { opacity: .15; }

  /* Midnight: lights that flash */
  .light .dot { opacity: .75; transition: opacity .2s; }
  .light .halo { opacity: 0; transition: opacity .25s; }
  .light.flash .dot { opacity: 1; }
  .light.flash .halo { opacity: 1; }
  .lure-glow { animation: glow 2.4s ease-in-out infinite alternate; }
  @keyframes glow { from { opacity: .55; } to { opacity: 1; } }

  /* Caption */
  .caption {
    width: min(100%, 1100px);
    background: var(--panel); border-radius: var(--radius);
    padding: 14px 18px; display: grid; gap: 10px;
    box-shadow: inset 0 0 0 2px #ffffff10;
  }
  .prompt-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  #prompt { margin: 0; font-size: 1.12rem; line-height: 1.45; flex: 1 1 320px; }
  #actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .fact {
    border-left: 5px solid var(--accent); background: #ffffff0d; border-radius: 10px;
    padding: 10px 14px; animation: factIn .45s ease;
  }
  .fact strong { display: block; color: var(--accent); margin-bottom: 2px; }
  .fact p { margin: 0; line-height: 1.45; color: var(--ink); }
  .badge { display: inline-block; background: var(--coral); color: #fff; font-size: .75rem; font-weight: 700; border-radius: 999px; padding: 2px 8px; margin-right: 8px; vertical-align: 2px; }
  @keyframes factIn { from { opacity: 0; transform: translateY(8px); } }

  /* Journal */
  dialog.journal {
    width: min(920px, calc(100% - 32px)); max-height: calc(100svh - 48px);
    border: 0; border-radius: 18px; padding: 0; background: var(--panel); color: var(--ink);
  }
  dialog.journal::backdrop { background: #000b; }
  .journal header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .journal h2 { margin: 0; font-size: 1.3rem; margin-right: auto; }
  .journal .sub { color: var(--ink-soft); }
  .journal section { padding: 0 20px 18px; }
  .journal h3 { margin: 6px 0 10px; font-size: 1rem; color: var(--ink-soft); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .card { background: #ffffff0f; border-radius: 12px; padding: 12px 14px; border-top: 4px solid var(--zc, #fff); }
  .card b { display: block; margin-bottom: 4px; }
  .card p { margin: 0; font-size: .93rem; line-height: 1.4; color: var(--ink-soft); }
  .card.locked { opacity: .5; border-top-style: dashed; }
  .z-reef { --zc: #4fd1e8; } .z-twilight { --zc: #4a6fd1; } .z-midnight { --zc: #b366ff; }

  /* Turtle Lunch */
  .overlay { position: fixed; inset: 0; background: #000c; display: grid; place-items: center; z-index: 10; padding: 16px; }
  .game-box { position: relative; width: min(100%, 860px); }
  #turtleCanvas { display: block; width: 100%; aspect-ratio: 5 / 3; border-radius: var(--radius); touch-action: none; background: #0b5d8f; }
  .game-panel {
    position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 12px; padding: 24px;
    background: #021a30cc; border-radius: var(--radius);
  }
  .game-panel h2 { margin: 0; font-size: 2rem; }
  .game-panel p { margin: 0 auto; max-width: 46ch; font-size: 1.1rem; line-height: 1.45; }
  .game-panel .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* Read aloud */
  .listen {
    border: 0; background: #ffffff18; color: var(--ink); border-radius: 999px; cursor: pointer;
    width: 36px; height: 36px; flex: none; font-size: 1rem; line-height: 1;
  }
  .listen:hover { background: #ffffff30; }
  .listen:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  body.no-speech .listen, body.no-speech #btnNarration { display: none; }
  .w { border-radius: 4px; transition: background .1s; }
  .w.speaking { background: #ffd23f66; box-shadow: 0 0 0 2px #ffd23f66; }
  .fact { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; }
  .zone { background: none; border: 0; font: inherit; cursor: pointer; padding: 6px 10px; border-radius: 999px; }
  .zone:hover { background: #ffffff14; color: var(--ink); }
  .zone:focus-visible { outline: 3px solid var(--accent); }
  .card { position: relative; }
  .card .listen { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; font-size: .85rem; }
  .card b { padding-right: 34px; }

  /* Voice settings */
  dialog.voicepanel {
    width: min(440px, calc(100% - 32px)); border: 0; border-radius: 18px; padding: 20px;
    background: var(--panel); color: var(--ink);
  }
  dialog.voicepanel::backdrop { background: #0008; }
  .voicepanel h2 { margin: 0 0 16px; font-size: 1.25rem; }
  .vp-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; font-weight: 600; }
  .seg { display: inline-flex; background: #ffffff14; border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: none; color: var(--ink); padding: 7px 13px; border-radius: 999px; cursor: pointer; font-weight: 600; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .seg button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  #vpVoice { font: inherit; padding: 7px 10px; border-radius: 10px; border: 0; background: #ffffff1f; color: var(--ink); max-width: 240px; }
  #vpVoice option { color: #000; }
  .vp-tip { font-size: .88rem; color: var(--ink-soft); line-height: 1.45; margin: 4px 0 16px; }
  .vp-actions { display: flex; justify-content: flex-end; gap: 8px; }

  /* Locked dive button and its hint */
  .nav-btn.down.locked { background: #0b2f52e6; color: var(--ink); animation: none; box-shadow: inset 0 0 0 2px #ffffff30, 0 4px 14px #0007; }
  .toast {
    position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); z-index: 3;
    background: #021a30ee; color: var(--ink); padding: 10px 16px; border-radius: 12px;
    width: max-content; max-width: min(90%, 520px); text-align: center; line-height: 1.4;
    box-shadow: 0 6px 20px #0008; animation: factIn .3s ease;
  }

  /* Welcome screen */
  .welcome {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; text-align: center;
    background: radial-gradient(ellipse at 50% 0%, #2a9fd0, #0b3b66 45%, #020a18); overflow: hidden;
  }
  .welcome-inner { position: relative; max-width: 580px; display: grid; gap: 18px; justify-items: center; }
  .welcome h1 { margin: 0; font-size: clamp(2.4rem, 9vw, 4.2rem); line-height: 1.05; }
  .welcome h1 .see { color: var(--accent); }
  .welcome .mascot { font-size: 3.6rem; animation: bob 3s ease-in-out infinite; }
  .welcome p { margin: 0; font-size: 1.15rem; line-height: 1.5; }
  .welcome .hint { color: var(--ink-soft); font-size: .95rem; }
  .welcome .how { background: #ffffff12; border-radius: var(--radius); padding: 14px 18px; text-align: left; width: 100%; }
  .welcome .how h2 { margin: 0 0 8px; font-size: 1.05rem; color: var(--accent); }
  .welcome .how ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .welcome .how li { display: grid; grid-template-columns: 28px 1fr; gap: 6px; line-height: 1.4; }
  .welcome .how li:nth-child(2) { font-weight: 700; }
  .welcome .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .welcome .bubbles span {
    position: absolute; bottom: -40px; border-radius: 50%; border: 2px solid #ffffff55; background: #ffffff14;
    animation: rise-far linear infinite;
  }
  @keyframes rise-far { from { transform: translateY(0); } to { transform: translateY(-115vh); } }
  .btn.big { font-size: 1.25rem; padding: 14px 30px; }

  /* Where am I? card */
  dialog.zonecard {
    width: min(780px, calc(100% - 32px)); max-height: calc(100svh - 32px);
    border: 0; border-radius: 18px; padding: 22px; background: var(--panel); color: var(--ink);
  }
  dialog.zonecard::backdrop { background: #000a; }
  .zc-grid { display: grid; grid-template-columns: 170px 1fr; gap: 22px; align-items: start; }
  .zc-map { width: 100%; height: auto; border-radius: 12px; }
  .zc-map text { font-family: var(--font); }
  .zc-ping { animation: ping 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes ping { from { transform: scale(.6); opacity: .9; } to { transform: scale(2.2); opacity: 0; } }
  .zc-title { margin: 0 0 2px; font-size: 1.5rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  .zc-where { margin: 0 0 14px; color: var(--ink-soft); font-size: 1.05rem; }
  .zc-stats { display: grid; gap: 8px; margin-bottom: 14px; }
  .zc-stat { display: grid; grid-template-columns: 32px 1fr; gap: 8px; align-items: center; background: #ffffff0d; border-radius: 10px; padding: 8px 12px; }
  .zc-stat .ico { font-size: 1.35rem; text-align: center; }
  .zc-stat b { display: block; font-size: .78rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .06em; }
  .zc-desc { margin: 0 0 12px; line-height: 1.5; font-size: 1.05rem; }
  .zc-actions { display: flex; justify-content: flex-end; margin-top: 16px; }

  @media (max-width: 600px) {
    .zc-grid { grid-template-columns: 1fr; }
    .zc-map { max-width: 140px; justify-self: center; }
    .topbar h1 { font-size: 1.1rem; }
    .label { display: none; }
    #prompt { font-size: 1rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01s !important; }
  }
</style>
</head>
<body>

<!-- Shared SVG definitions (filters, gradients, reusable shapes) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feFlood flood-color="#fff6a8"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feGaussianBlur stdDeviation="5"/>
      <feMerge><feMergeNode/><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="g-reef-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fe0f0"/>
      <stop offset=".55" stop-color="#1c8fc4"/>
      <stop offset="1" stop-color="#0f5d91"/>
    </linearGradient>
    <linearGradient id="g-ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g-twilight-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a63a3"/>
      <stop offset=".35" stop-color="#143b72"/>
      <stop offset="1" stop-color="#06122b"/>
    </linearGradient>
    <linearGradient id="g-midnight-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07102a"/>
      <stop offset="1" stop-color="#010207"/>
    </linearGradient>
    <radialGradient id="g-spot">
      <stop offset="0" stop-color="#000"/>
      <stop offset=".6" stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </radialGradient>
    <radialGradient id="g-halo-yellow"><stop offset="0" stop-color="#e8ff7a" stop-opacity=".75"/><stop offset="1" stop-color="#e8ff7a" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-halo-blue"><stop offset="0" stop-color="#4fa3ff" stop-opacity=".75"/><stop offset="1" stop-color="#4fa3ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-halo-aqua"><stop offset="0" stop-color="#5cffd8" stop-opacity=".7"/><stop offset="1" stop-color="#5cffd8" stop-opacity="0"/></radialGradient>
    <linearGradient id="g-cone" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8c0" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff8c0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip-clown"><ellipse rx="40" ry="22"/></clipPath>
    <g id="tentacles" fill="none" stroke-linecap="round">
      <path d="M-40 -30 Q-70 -80 -55 -120"/>
      <path d="M-30 -38 Q-45 -95 -30 -135"/>
      <path d="M-18 -42 Q-30 -100 -10 -145"/>
      <path d="M-6 -44 Q-5 -100 5 -150"/>
      <path d="M6 -44 Q15 -100 22 -145"/>
      <path d="M18 -42 Q35 -95 40 -135"/>
      <path d="M30 -38 Q55 -85 58 -122"/>
      <path d="M40 -30 Q70 -70 72 -105"/>
    </g>
    <symbol id="lanternfish" overflow="visible">
      <path d="M-14 0 L-26 -8 L-24 0 L-26 8Z" fill="#33507a"/>
      <ellipse rx="17" ry="6.5" fill="#3d5f8f"/>
      <circle cx="10" cy="-1.5" r="3" fill="#cfe3ff"/>
      <circle cx="10.6" cy="-1.5" r="1.5" fill="#0a1020"/>
      <g fill="#7ff9ff" filter="url(#softglow)">
        <circle cx="-8" cy="3.5" r="1.6"/><circle cx="-2" cy="4" r="1.6"/><circle cx="4" cy="3.8" r="1.6"/><circle cx="12" cy="3" r="1.4"/>
      </g>
    </symbol>
  </defs>
</svg>

<header class="topbar">
  <h1><span aria-hidden="true">👁️‍🗨️</span><span>Deep <span class="see">See</span> World</span></h1>
  <button class="zone" id="btnWhere" type="button" data-t-title="ui.whereAmI">
    <span class="zone-bar" aria-hidden="true"><span data-room="reef"></span><span data-room="twilight"></span><span data-room="midnight"></span></span>
    <span id="zoneText"></span>
  </button>
  <button class="btn" id="btnJournal" type="button">📖 <span class="label" data-t="ui.journal"></span><span class="count" id="factCount">0/0</span></button>
  <button class="btn icon-btn" id="btnNarration" type="button" aria-pressed="true">🗣️</button>
  <button class="btn icon-btn" id="btnSound" type="button" aria-pressed="true">🔊</button>
  <button class="btn icon-btn" id="btnRestart" type="button" data-t-title="ui.restart">↺</button>
</header>

<main>
  <div class="stage" id="stage">

    <!-- ===================== SUNLIT ZONE: CORAL REEF ===================== -->
    <svg id="scene-reef" class="scene" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" role="group" aria-label="A sunny coral reef">
      <rect width="1000" height="600" fill="url(#g-reef-water)"/>
      <g class="rays" fill="url(#g-ray)">
        <polygon class="ray" points="120,0 200,0 400,600 250,600"/>
        <polygon class="ray" points="330,0 380,0 560,600 470,600"/>
        <polygon class="ray" points="560,0 650,0 820,600 680,600"/>
        <polygon class="ray" points="800,0 850,0 1000,480 960,600"/>
      </g>
      <path d="M0 16 Q25 6 50 16 T100 16 T150 16 T200 16 T250 16 T300 16 T350 16 T400 16 T450 16 T500 16 T550 16 T600 16 T650 16 T700 16 T750 16 T800 16 T850 16 T900 16 T950 16 T1000 16 V0 H0Z" fill="#fff" opacity=".35"/>

      <!-- far fish school -->
      <g fill="#0d4f7a" opacity=".35">
        <g class="drift"><path d="M0 200 q12 -7 24 0 q-12 7 -24 0z m0 0 l-7 -5 v10z"/><path d="M40 215 q12 -7 24 0 q-12 7 -24 0z m0 0 l-7 -5 v10z"/><path d="M15 235 q12 -7 24 0 q-12 7 -24 0z m0 0 l-7 -5 v10z"/><path d="M60 190 q12 -7 24 0 q-12 7 -24 0z m0 0 l-7 -5 v10z"/></g>
      </g>
      <!-- distant reef -->
      <path d="M0 470 Q60 420 120 450 Q170 400 240 445 Q320 410 380 450 Q470 420 540 455 Q640 415 720 450 Q820 420 1000 440 V600 H0Z" fill="#0e5f8c" opacity=".55"/>

      <!-- plankton (oxygen fact) -->
      <g class="hit" data-id="plankton" data-fact="oxygen" aria-label="Phytoplankton" transform="translate(150,95)">

<script src="deep-see-world.en.js"></script>
<script>
(function () {
  "use strict";

  // ---------- Text ----------
  const LANG = "en";
  const M = window.__dswMessages[LANG];
  function t(path, vars) {
    const v = path.split(".").reduce((o, k) => (o ? o[k] : undefined), M);
    if (typeof v !== "string") { console.warn("Missing message:", path); return path; }
    return v.replace(/\{(\w+)\}/g, (_, k) => (vars && k in vars ? vars[k] : "{" + k + "}"));
  }
  const $ = (sel) => document.querySelector(sel);
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-t-title]").forEach((el) => { el.title = t(el.dataset.tTitle); el.setAttribute("aria-label", el.title); });

  // ---------- State ----------
  const STORE = "deep-see-world:v1";
  const ROOMS = ["reef", "twilight", "midnight"];
  const DEPTH = { reef: 10, twilight: 500, midnight: 2000 };
  const ARRIVAL_FACT = { reef: "sunlit", twilight: "twilight", midnight: "midnight" };
  // Journal sections. Every fact in the dictionary must appear exactly once.
  const FACT_ZONES = {
    reef: ["sunlit", "redLight", "coral", "reefLife", "anemone", "cleaner", "goby", "pistolSnap", "oxygen", "turtle"],
    twilight: ["twilight", "redAnimals", "migration", "lanternfish", "hatchetfish", "spermWhale"],
    midnight: ["midnight", "bigMouths", "pressure", "bioluminescence", "anglerfish", "atolla", "vampireSquid", "unexplored"],
  };
  const FACT_TOTAL = Object.keys(M.facts).length;
  const DID_YOU_KNOW = { reef: "redLight", twilight: "redAnimals", midnight: "bigMouths" };

  function fresh() { return { room: "reef", facts: [], solved: {}, pairs: [], muted: false, narration: false, narrationChosen: false, speed: "slow", voiceName: "" }; }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE));
      if (s && ROOMS.includes(s.room)) {
        const loaded = Object.assign(fresh(), s);
        if (!loaded.narrationChosen) loaded.narration = false;  // the voice used to be on by default
        return loaded;
      }
    } catch (e) { /* storage unavailable: start fresh */ }
    return fresh();
  }
  function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { /* ignore */ } }
  const state = load();

  // ---------- Sound (synthesized, nothing downloaded) ----------
  let actx = null;
  function tone(freq, dur, type, vol, when, slideTo) {
    if (state.muted) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      const t0 = actx.currentTime + (when || 0);
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.1, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(actx.destination);
      o.start(t0); o.stop(t0 + dur + 0.05);
    } catch (e) { /* no audio */ }
  }
  const sfx = {
    bubble: () => tone(320, 0.16, "sine", 0.08, 0, 900),
    good: () => [523, 659, 784].forEach((f, i) => tone(f, 0.22, "triangle", 0.12, i * 0.11)),
    bad: () => { tone(220, 0.2, "square", 0.04); tone(175, 0.25, "square", 0.04, 0.15); },
    fact: () => { tone(880, 0.12, "sine", 0.07); tone(1320, 0.2, "sine", 0.05, 0.08); },
    win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.32, "triangle", 0.12, i * 0.14)),
    munch: () => tone(500, 0.1, "sine", 0.1, 0, 250),
  };
  const btnSound = $("#btnSound");
  function renderSound() {
    btnSound.textContent = state.muted ? "🔇" : "🔊";
    btnSound.setAttribute("aria-pressed", String(!state.muted));
    btnSound.title = t("ui.sound");
    btnSound.setAttribute("aria-label", btnSound.title);
  }
  btnSound.addEventListener("click", () => { state.muted = !state.muted; save(); renderSound(); });
  renderSound();

  // ---------- Read aloud ----------
  // Uses only the voices installed on the device (localService), so no text ever leaves the browser.
  const narrator = (() => {
    const NOVELTY = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/;
    const FAVORITE = /Samantha|Ava|Allison|Susan|Karen|Moira|Tessa|Serena|Daniel|Zira|Aria|Jenny|Libby|Sonia/;
    const synth = () => window.speechSynthesis;
    const RATES = { slow: 0.7, medium: 0.85, fast: 1 };
    let voice = null, list = [], pending = [], flushTimer = 0, lit = null, ready = false;
    function pickVoice() {
      const s = synth();
      const local = s ? s.getVoices().filter((v) => v.localService && /^en([-_]|$)/i.test(v.lang) && !NOVELTY.test(v.name)) : [];
      const score = (v) => (/Enhanced|Premium|Natural/.test(v.name) ? 4 : 0) + (FAVORITE.test(v.name) ? 2 : 0) +
        (/^en[-_]US$/i.test(v.lang) ? 1 : 0) + (v.default ? 0.5 : 0);
      list = local.sort((a, b) => score(b) - score(a));
      voice = list.find((v) => v.name === state.voiceName) || list[0] || null;
      document.body.classList.toggle("no-speech", !voice);
    }
    function unlight() { if (lit) lit.classList.remove("speaking"); lit = null; }
    function stop() {
      clearTimeout(flushTimer);
      pending = [];
      if (synth()) synth().cancel();
      unlight();
    }
    // segs: [{ text, marks? }] where marks map character offsets in text to word spans to highlight.
    function speakNow(segs) {
      stop();
      if (!voice) pickVoice();
      if (!voice) return;
      segs.forEach((seg) => {
        if (!seg || !seg.text) return;
        const u = new SpeechSynthesisUtterance(seg.text);
        try { u.voice = voice; } catch (e) { /* non-native voice object */ }
        u.lang = voice.lang; u.rate = RATES[state.speed] || RATES.slow; u.pitch = 1;
        if (seg.marks) {
          u.onboundary = (e) => {
            if (e.name && e.name !== "word") return;
            let m = null;
            for (const k of seg.marks) { if (k.start <= e.charIndex) m = k; else break; }
            unlight();
            if (m) { lit = m.span; lit.classList.add("speaking"); }
          };
          u.onend = u.onerror = unlight;
        }
        synth().speak(u);
      });
    }
    // Automatic narration: everything added in the same moment is read in order.
    function add(seg) {
      if (!ready || !state.narration || !seg) return;
      pending.push(seg);
      clearTimeout(flushTimer);
      flushTimer = setTimeout(() => speakNow(pending.slice()), 0);
    }
    if (synth()) synth().onvoiceschanged = pickVoice;
    pickVoice();
    return {
      add, speakNow, stop, refresh: pickVoice,
      start() { ready = true; pickVoice(); },
      voices: () => list,
      current: () => voice,
    };
  })();

  // Wrap each word in a span and build the text the voice reads, so spoken words can be highlighted.
  function spokenWord(word, prev) {
    let w = word.replace(/[\p{Extended_Pictographic}\u{FE0F}\u{200D}←→↑↓⬆⬇“”]/gu, "")
      .replace(/°C/g, "degrees Celsius").replace(/(\d)–(\d)/g, "$1 to $2").replace(/…/g, ".");
    if (/^m[.,!?]?$/.test(w) && /\d$/.test(prev)) w = w.replace("m", "meters");
    return w.trim();
  }
  function renderSpeakable(el, text) {
    el.replaceChildren();
    const marks = [];
    let out = "", prev = "";
    text.split(/(\s+)/).forEach((tok) => {
      if (!tok) return;
      if (/^\s+$/.test(tok)) { el.append(tok); return; }
      const span = document.createElement("span");
      span.className = "w";
      span.textContent = tok;
      el.append(span);
      const sp = spokenWord(tok, prev);
      prev = tok;
      if (!sp) return;
      if (out) out += " ";
      marks.push({ start: out.length, span });
      out += sp;
    });
    return { text: out, marks };
  }
  function withLabel(label, seg) {
    const shift = label.length + 2;
    return { text: label + ": " + seg.text, marks: seg.marks.map((m) => ({ start: m.start + shift, span: m.span })) };
  }
  function listenButton(getSegs) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "listen";
    b.textContent = "🔈";
    b.title = t("ui.listen");
    b.setAttribute("aria-label", b.title);
    b.addEventListener("click", () => narrator.speakNow(getSegs()));
    return b;
  }
  const btnNarration = $("#btnNarration");
  function renderNarration() {
    btnNarration.textContent = state.narration ? "🗣️" : "🤫";
    btnNarration.setAttribute("aria-pressed", String(state.narration));
    btnNarration.title = t("ui.narration");
    btnNarration.setAttribute("aria-label", btnNarration.title);
  }
  renderNarration();

  const voicePanel = $("#voicePanel");
  const sampleVoice = () => narrator.speakNow([{ text: t("ui.voiceSample") }]);
  function setPressed(group, value) {
    document.querySelectorAll(group + " button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === value)));
  }
  function renderVoicePanel() {
    setPressed("#vpOnOff", state.narration ? "on" : "off");
    setPressed("#vpSpeed", state.speed);
    const sel = $("#vpVoice");
    sel.replaceChildren(...narrator.voices().map((v) => new Option(v.name + " (" + v.lang.replace("_", "-") + ")", v.name)));
    const cur = narrator.current();
    if (cur) sel.value = cur.name;
  }
  const choice = (e) => e.target.closest("button[data-v]");
  $("#vpOnOff").addEventListener("click", (e) => {
    const b = choice(e);
    if (!b) return;
    state.narration = b.dataset.v === "on"; state.narrationChosen = true; save();
    renderNarration(); renderVoicePanel();
    if (state.narration) sampleVoice(); else narrator.stop();
  });
  $("#vpSpeed").addEventListener("click", (e) => {
    const b = choice(e);
    if (!b) return;
    state.speed = b.dataset.v; save();
    renderVoicePanel(); sampleVoice();
  });
  $("#vpVoice").addEventListener("change", (e) => {
    state.voiceName = e.target.value; save();
    narrator.refresh(); sampleVoice();
  });
  $("#vpTry").addEventListener("click", sampleVoice);
  // Stop the sample here, not on the dialog's (asynchronous) close event, which could cancel the next narration.
  $("#vpClose").addEventListener("click", () => { narrator.stop(); voicePanel.close(); });
  btnNarration.addEventListener("click", () => { narrator.refresh(); renderVoicePanel(); voicePanel.showModal(); });

  // ---------- Caption & facts ----------
  const promptEl = $("#prompt"), actionsEl = $("#actions"), factEl = $("#fact");
  let promptSeg = null, factSegs = [];
  $("#listenPrompt").addEventListener("click", () => narrator.speakNow([promptSeg]));
  function say(text, actions) {
    promptSeg = renderSpeakable(promptEl, text);
    narrator.add(promptSeg);
    actionsEl.replaceChildren();
    (actions || []).forEach((a) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "btn" + (a.primary ? " primary" : "");
      b.textContent = a.label;
      b.addEventListener("click", a.onClick);
      actionsEl.append(b);
    });
  }
  function updateCount(pulse) {
    const el = $("#factCount");
    el.textContent = state.facts.length + "/" + FACT_TOTAL;
    if (pulse) { el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse"); }
  }
  function earnFact(id) {
    if (state.facts.includes(id)) return false;
    state.facts.push(id); save(); updateCount(true); sfx.fact();
    return true;
  }
  function showFact(id) {
    const f = M.facts[id];
    if (!f) return;
    const isNew = earnFact(id);
    const strong = document.createElement("strong");
    if (isNew) {
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = t("ui.newFact");
      strong.append(badge);
    }
    const title = document.createElement("span");
    strong.append(title);
    const p = document.createElement("p");
    factSegs = [renderSpeakable(title, f.title), renderSpeakable(p, f.text)];
    const body = document.createElement("div");
    body.append(strong, p);

    factEl.hidden = false;
    factEl.style.animation = "none"; void factEl.offsetWidth; factEl.style.animation = "";

  }

  // ---------- Clickable things ----------
  const hitEl = (id) => document.querySelector('.hit[data-id="' + id + '"]');
  document.querySelectorAll(".hit").forEach((el) => {
    el.setAttribute("tabindex", "0");
    el.setAttribute("role", "button");
    el.addEventListener("click", () => activate(el));

  }
  // Center of a clickable in its scene's coordinates (getCTM would include the screen scaling).
  function sceneCenter(el, top) {
    const b = el.getBBox(), x = b.x + b.width / 2, y = top ? b.y : b.y + b.height / 2;

    return [m.a * x + m.c * y + m.e, m.b * x + m.d * y + m.f];
  }
  function heart(el) {
    const [x, y] = sceneCenter(el, true);
    const tx = document.createElementNS("http://www.w3.org/2000/svg", "text");
    tx.setAttribute("x", x);
    tx.setAttribute("y", y);
    tx.setAttribute("text-anchor", "middle");
    tx.setAttribute("class", "heart");
    tx.textContent = "💛";

  }

  // ---------- Room: coral reef (symbiosis pairs) ----------
  const PARTNER = { clownfish: "anemone", anemone: "clownfish", shrimp: "eel", eel: "shrimp", pistol: "goby", goby: "pistol" };
  const PAIR_FACT = { clownfish: "anemone", anemone: "anemone", shrimp: "cleaner", eel: "cleaner", pistol: "goby", goby: "goby" };
  const MOVES = { clownfish: [-165, 125], shrimp: [72, -32], goby: [72, 4] };
  let selected = null;
  function select(id) {
    clearSelection();
    selected = id;
    hitEl(id).classList.add("selected");
  }
  function clearSelection() {
    if (selected) hitEl(selected).classList.remove("selected");
    selected = null;
  }
  function applyPair(key, animate) {
    Object.keys(PAIR_FACT).filter((id) => PAIR_FACT[id] === key).forEach((id) => {
      const el = hitEl(id), mv = MOVES[id];

    });

  // ---------- Room: twilight (daily vertical migration) ----------
  const twSvg = $("#scene-twilight"), school = $("#school"), plankton = twSvg.querySelector(".plankton");
  const ROUNDS = [{ sky: "night", ok: "up" }, { sky: "day", ok: "down" }];

  // ---------- Room: midnight (copy the light pattern) ----------
  const mnSvg = $("#scene-midnight"), spot = $("#spot");
  const GLOWERS = ["anglerfish", "atolla", "vampireSquid"];
  const NOTE = { anglerfish: 392, atolla: 523.25, vampireSquid: 659.25 };
  const LEVELS = [3, 4, 5];
  const sm = { mode: "idle", level: 0, seq: [], pos: 0, timers: [] };
  function later(fn, ms) { sm.timers.push(setTimeout(fn, ms)); }
  function clearSimon() { sm.timers.forEach(clearTimeout); sm.timers = []; sm.mode = sm.mode === "done" ? "done" : "idle"; }
  function flash(id, ms) {
    ms = ms || 450;
    const l = $("#light-" + id);
    l.classList.add("flash");
    tone(NOTE[id], ms / 1000, "sine", 0.14);
    setTimeout(() => l.classList.remove("flash"), ms);
  }
  function newSeq(n) {
    const s = [];
    while (s.length < n) {
      const c = GLOWERS[Math.floor(Math.random() * GLOWERS.length)];
      if (s.length >= 2 && s[s.length - 1] === c && s[s.length - 2] === c) continue;
      s.push(c);
    }
    return s;
  }
  function playback() {
    sm.mode = "watch";
    say(t("midnight.watch"));
    sm.seq.forEach((id, i) => later(() => flash(id, 500), 700 + i * 750));
    later(() => { sm.mode = "input"; sm.pos = 0; say(t("midnight.yourTurn")); }, 700 + sm.seq.length * 750);
  }
  function startSimon() {

  function finishSimon() {
    sm.mode = "done";

  // ---------- Room behavior ----------
  const ROOM = {

    twilight: {

        } }]);
      },
      leave() { clearSimon(); },
      hit(id) {
        if (!GLOWERS.includes(id)) return false;

        later(() => { sfx.good(); say(t("midnight.good")); }, 400);

  // ---------- Mini-game: Turtle Lunch ----------
  const turtleGame = (() => {
    const ov = $("#turtle"), cv = $("#turtleCanvas"), ctx = cv.getContext("2d");
    const panel = $("#turtlePanel");
    const W = 800, H = 480, TY = H - 95, GOAL = 10;
    let g = null, raf = 0, last = 0;
    const keys = {};

    function panelShow(title, text, actions) {
      $("#turtleTitle").textContent = title;
      narrator.add(renderSpeakable($("#turtleText"), text));
      const row = $("#turtleActions");
      row.replaceChildren();
      actions.forEach((a) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "btn" + (a.primary ? " primary" : "");
        b.textContent = a.label; b.addEventListener("click", a.onClick);
        row.append(b);
      });
      panel.hidden = false;
      row.firstChild.focus();
    }
    function newGame() { return { x: W / 2, tx: W / 2, face: -1, score: 0, lives: 3, items: [], pops: [], spawn: 0.4, time: 0, ouch: 0, over: false }; }
    function open() {
      ov.hidden = false;
      g = newGame(); g.over = true;
      draw();
      panelShow(t("turtle.title"), t("turtle.howTo"), [
        { label: t("turtle.go"), primary: true, onClick: start },
        { label: t("turtle.back"), onClick: close },
      ]);
    }
    function close() {
      cancelAnimationFrame(raf);
      ov.hidden = true;
      if (g) g.over = true;
      if (state.room === "reef") ROOM.reef.enter();
    }
    function start() {
      narrator.stop();
      panel.hidden = true;
      g = newGame();
      last = performance.now();
      cv.focus();
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(loop);
    }
    function end(win) {
      g.over = true;
      if (win) { sfx.win(); showFact("turtle"); } else sfx.bad();
      setTimeout(() => panelShow(win ? "🐢💛" : "🛍️", t(win ? "turtle.win" : "turtle.lose"), [
        { label: t("turtle.again"), primary: true, onClick: start },
        { label: t("turtle.back"), onClick: close },
      ]), 400);
    }
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      update(dt);
      draw();
      if (!g.over) raf = requestAnimationFrame(loop);
    }
    function update(dt) {
      g.time += dt;
      if (keys.ArrowLeft) g.tx = Math.max(50, g.tx - 480 * dt);
      if (keys.ArrowRight) g.tx = Math.min(W - 50, g.tx + 480 * dt);
      const dx = g.tx - g.x;
      g.x += dx * Math.min(1, dt * 9);
      if (Math.abs(dx) > 2) g.face = dx > 0 ? 1 : -1;

      g.spawn -= dt;
      if (g.spawn <= 0) {
        const bagChance = 0.3 + Math.min(0.15, g.time * 0.004);
        g.items.push({
          type: Math.random() < bagChance ? "bag" : "jelly",
          x: 60 + Math.random() * (W - 120), y: -40,
          vy: 55 + Math.random() * 35 + g.time * 1.2, ph: Math.random() * 6.28,
        });
        g.spawn = Math.max(0.55, 1.1 - g.time * 0.01);
      }
      const mx = g.x + g.face * 34, my = TY - 4;
      g.items = g.items.filter((it) => {
        it.y += it.vy * dt; it.ph += dt * 2; it.x += Math.sin(it.ph) * 22 * dt;
        if (it.y > H + 50) return false;
        if (Math.hypot(it.x - mx, it.y - my) < 44) {
          if (it.type === "jelly") { g.score++; sfx.munch(); g.pops.push({ x: it.x, y: it.y, life: 0.6 }); }
          else { g.lives--; g.ouch = 1.2; sfx.bad(); }
          return false;
        }
        return true;
      });
      g.pops = g.pops.filter((p) => (p.life -= dt) > 0);
      g.ouch = Math.max(0, g.ouch - dt);
      if (g.score >= GOAL) end(true);
      else if (g.lives <= 0) end(false);
    }

    function drawBackground() {
      const grd = ctx.createLinearGradient(0, 0, 0, H);
      grd.addColorStop(0, "#5fe0f0"); grd.addColorStop(0.6, "#1c8fc4"); grd.addColorStop(1, "#0f5d91");
      ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "rgba(255,255,255,0.08)";
      [[100, 60], [330, 40], [560, 70]].forEach(([x, w]) => {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + w, 0); ctx.lineTo(x + w + 160, H); ctx.lineTo(x + 100, H); ctx.fill();
      });
      ctx.fillStyle = "#e8cf8f";
      ctx.beginPath(); ctx.moveTo(0, H - 30);
      ctx.quadraticCurveTo(W / 2, H - 55, W, H - 25); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
    }
    function drawJelly(it) {
      ctx.save(); ctx.translate(it.x, it.y);
      ctx.strokeStyle = "rgba(255,190,235,0.8)"; ctx.lineWidth = 2;
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath(); ctx.moveTo(i * 7, 4);
        for (let k = 1; k <= 4; k++) ctx.lineTo(i * 7 + Math.sin(it.ph * 2 + k + i) * 4, 4 + k * 8);
        ctx.stroke();
      }
      const squish = 1 + Math.sin(it.ph * 3) * 0.06;
      ctx.scale(squish, 2 - squish);
      ctx.fillStyle = "rgba(255,140,215,0.85)";
      ctx.beginPath(); ctx.arc(0, 4, 22, Math.PI, 0); ctx.quadraticCurveTo(0, 12, -22, 4); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.45)";
      ctx.beginPath(); ctx.ellipse(-8, -6, 6, 4, -0.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    function drawBag(it) {
      ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(Math.sin(it.ph) * 0.25);
      ctx.fillStyle = "rgba(245,248,252,0.8)"; ctx.strokeStyle = "rgba(170,185,200,0.95)"; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-18, -8); ctx.lineTo(18, -8); ctx.lineTo(22, 26); ctx.quadraticCurveTo(0, 32, -22, 26); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(-9, -8, 7, Math.PI, 0); ctx.stroke();
      ctx.beginPath(); ctx.arc(9, -8, 7, Math.PI, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-8, 4); ctx.lineTo(-3, 18); ctx.moveTo(6, 2); ctx.lineTo(10, 20); ctx.stroke();
      ctx.restore();
    }
    function drawTurtle() {
      const flap = Math.sin(g.time * 7) * 0.35;
      ctx.save(); ctx.translate(g.x, TY); ctx.scale(g.face, 1);
      ctx.fillStyle = "#2a3746";
      ctx.save(); ctx.translate(14, -8); ctx.rotate(-0.4 + flap);
      ctx.beginPath(); ctx.ellipse(-20, -14, 30, 8, -0.5, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      ctx.fillStyle = "#3b4a5a";
      ctx.beginPath(); ctx.ellipse(-48, 10, 14, 5, 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#2f3e4e";
      ctx.beginPath(); ctx.ellipse(0, 0, 48, 24, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#4c5f73"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-44, 0); ctx.lineTo(42, 0);
      ctx.moveTo(-40, -11); ctx.quadraticCurveTo(0, -20, 40, -9);
      ctx.moveTo(-40, 11); ctx.quadraticCurveTo(0, 20, 40, 9); ctx.stroke();
      ctx.fillStyle = "#3b4a5a";
      ctx.beginPath(); ctx.arc(54, -4, 15, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(60, -8, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#3b4a5a";
      ctx.save(); ctx.translate(14, 8); ctx.rotate(0.4 - flap);
      ctx.beginPath(); ctx.ellipse(-22, 14, 32, 8, 0.5, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      if (g.ouch > 0) { ctx.fillStyle = "rgba(255,80,80," + (g.ouch / 2.4) + ")"; ctx.beginPath(); ctx.ellipse(0, 0, 60, 32, 0, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    }
    function draw() {
      drawBackground();
      g.items.forEach((it) => (it.type === "jelly" ? drawJelly(it) : drawBag(it)));
      g.pops.forEach((p) => {
        ctx.fillStyle = "rgba(255,255,255," + p.life + ")";
        for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(p.x + Math.cos(i * 1.3) * (1 - p.life) * 50, p.y - (1 - p.life) * 40 + i * 4, 3, 0, Math.PI * 2); ctx.fill(); }
      });
      drawTurtle();
      ctx.font = "26px " + getComputedStyle(document.body).fontFamily;
      ctx.textBaseline = "top";
      ctx.textAlign = "left";
      ctx.fillText("❤️".repeat(Math.max(0, g.lives)) + "🤍".repeat(3 - Math.max(0, g.lives)), 16, 14);
      ctx.textAlign = "right"; ctx.fillStyle = "#fff";
      ctx.fillText(t("turtle.score", { score: g.score, goal: GOAL }), W - 16, 16);
      if (g.ouch > 0) {
        ctx.textAlign = "center"; ctx.fillStyle = "rgba(255,255,255," + Math.min(1, g.ouch) + ")";
        ctx.font = "bold 34px " + getComputedStyle(document.body).fontFamily;
        ctx.fillText(t("turtle.ouch"), W / 2, H / 2 - 60);
      }
    }

    function aim(e) {
      const r = cv.getBoundingClientRect();
      if (g) g.tx = Math.max(50, Math.min(W - 50, ((e.clientX - r.left) / r.width) * W));
    }
    cv.addEventListener("pointermove", aim);
    cv.addEventListener("pointerdown", aim);
    window.addEventListener("keydown", (e) => {
      if (ov.hidden) return;
      if (e.key === "Escape") { close(); return; }
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") { keys[e.key] = true; e.preventDefault(); }
    });
    window.addEventListener("keyup", (e) => { keys[e.key] = false; });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) cancelAnimationFrame(raf);
      else if (g && !g.over && !ov.hidden) { last = performance.now(); raf = requestAnimationFrame(loop); }
    });
    return { open };
  })();

  // ---------- Start ----------
  state.pairs.forEach((key) => applyPair(key, false));
  updateCount(false);
  // Welcome screen. Browsers only allow speech after a click, so it also starts the narrator.
  const welcome = $("#welcome");
  const hasProgress = state.facts.length > 0;
  $("#btnStart").textContent = t(hasProgress ? "welcome.continue" : "welcome.start");
  $("#btnStartOver").hidden = !hasProgress;
  $("#btnStartOver").addEventListener("click", restartGame);
  $("#btnStart").addEventListener("click", () => {
    welcome.hidden = true;
    narrator.start();
    openZoneCard(state.room);
  });
  // Testing shortcut: index.html#midnight skips the welcome screen and opens that room directly.
  const hashRoom = location.hash.slice(1);
  if (ROOMS.includes(hashRoom)) { welcome.hidden = true; narrator.start(); }
  else $("#btnStart").focus();
  showRoom(ROOMS.includes(hashRoom) ? hashRoom : state.room);
})();
</script>
</body>
</html>
